name: Deploy MUA Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q -o mua-planner-source.zip -d source
      - name: Improve Android mobile behavior
        run: |
          sed -i 's/overscroll-behavior-y:none/overscroll-behavior-y:auto/g' source/app/globals.css
          cat >> source/app/globals.css <<'CSS'
          html{-webkit-text-size-adjust:none;text-size-adjust:none}
          @media(max-width:850px){.bottom-nav{background:#fffdf9;backdrop-filter:none;transform:none;backface-visibility:visible;contain:none}.bottom-nav button{font-size:11px;padding-inline:clamp(8px,3.4vw,17px)}}
          @media(max-width:620px){.appointment{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 12px;align-items:start}.appointment-time,.appointment-time.with-date{grid-column:1;grid-row:1/3;min-width:0}.appointment-info{grid-column:2;min-width:0}.appointment-info strong{word-break:normal;overflow-wrap:anywhere}.details-button{grid-column:2;justify-self:start;max-width:100%;white-space:normal}.address-link{align-items:flex-start}.status-text{line-height:1.45}}
          CSS
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: source
        run: pnpm run build:github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/gh-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
