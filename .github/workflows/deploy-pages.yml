name: Deploy MUA Planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q -o mua-planner-source.zip -d source
      - name: Improve Android mobile behavior
        run: |
          sed -i 's/overscroll-behavior-y:none/overscroll-behavior-y:auto/g' source/app/globals.css
          cat >> source/app/globals.css <<'CSS'
          html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
          @media(max-width:850px){.bottom-nav{background:#fffdf9;backdrop-filter:none;transform:none;backface-visibility:visible;contain:none}.bottom-nav button{font-size:clamp(.68rem,2.8vw,.75rem);padding-inline:clamp(8px,3.4vw,17px)}}
          CSS
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: source
        run: pnpm run build:github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/gh-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
